services:
  order-service:
    build: ./services/order
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [postgres, kafka]
  inventory-service:
    build: ./services/inventory
    ports: ["8002:8000"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/inventory
    depends_on: [postgres]
  customer-service:
    build: ./services/customer
    ports: ["8003:8000"]
  api-gateway:
    build: ./services/gateway
    ports: ["8000:8000"]
    environment:
      ORDER_URL: http://order-service:8000
      INVENTORY_URL: http://inventory-service:8000
      CUSTOMER_URL: http://customer-service:8000
    depends_on: [order-service, inventory-service, customer-service]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
volumes:
  pgdata:
